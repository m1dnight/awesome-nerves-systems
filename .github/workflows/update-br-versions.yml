name: Update nerves_system_br versions

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh versions in README
        id: refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'summary<<EOF'
            python3 .github/scripts/update_br_versions.py README.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/update-br-versions
          delete-branch: true
          commit-message: Update nerves_system_br versions
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: Update nerves_system_br versions
          body: |
            Automated refresh of the `nerves_system_br` column from each system's `mix.exs` / `mix.lock`.

            ```
            ${{ steps.refresh.outputs.summary }}
            ```
